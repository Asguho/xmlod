name: Upcoming dependency compatibility

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    env:
      SCHEMA_XML_TEST_TYPESCRIPT: latest
      SCHEMA_XML_TEST_ZOD: latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify source with newer Deno
        run: deno task verify
      - name: Build npm tarball
        run: deno task pack
      - name: Test current TypeScript and Zod consumers
        run: deno task test:node
