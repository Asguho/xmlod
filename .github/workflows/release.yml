# Requires the schema-xml npm trusted publisher: Asguho/schema-xml, release.yml, npm-publish.
# Allow direct npm publish in npm settings; no NPM_TOKEN is used.
name: Release to npm (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish-to-npm" to confirm you intend to publish'
        required: true
        type: string
      version:
        description: Version being released; must match deno.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ inputs.confirm == 'publish-to-npm' && github.ref == 'refs/heads/main' }}
    environment: npm-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org

      - name: Ensure the dispatched version matches deno.json
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          actual="$(node -p 'JSON.parse(require("fs").readFileSync("deno.json", "utf8")).version')"
          if [ "$actual" != "$EXPECTED_VERSION" ]; then
            echo "deno.json has version $actual but the workflow was dispatched for $EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Install pinned npm
        run: npm install --global npm@11.16.0

      - name: Verify (fmt, lint, check, test)
        run: deno task verify

      - name: Pack (dry run)
        run: deno task pack:dry

      - name: Build npm tarball
        run: deno task pack

      - name: Inspect tarball contents
        run: tar -tzf dist/schema-xml.tgz

      - name: Test Node consumption of the tarball
        run: ./scripts/node_consumer_test.sh dist/schema-xml.tgz

      - name: Publish to npm
        run: npm publish ./dist/schema-xml.tgz --access public --provenance
