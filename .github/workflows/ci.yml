name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify, pack, and test Node consumption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify (fmt, lint, check, test)
        run: deno task verify

      - name: Pack (dry run)
        run: deno task pack:dry

      - name: Build npm tarball
        run: deno task pack

      - name: Inspect tarball contents
        run: tar -tzf dist/xmlod.tgz

      - name: Test Node consumption of the tarball
        run: ./scripts/node_consumer_test.sh dist/xmlod.tgz

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: dist/xmlod.tgz
